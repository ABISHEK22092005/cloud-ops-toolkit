name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Secret Detection: Gitleaks"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "SAST: ShellCheck Linter"
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck sys_health.sh

      - name: "Lint: Hadolint Dockerfile Linter"
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Build Docker Image
        run: docker build -t cloud-ops-health:test .

      - name: "Security Scan: Aqua Trivy (SARIF Report)"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloud-ops-health:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: "Upload Trivy Scan to GitHub Security"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Container Smoke Test
        run: docker run --rm cloud-ops-health:test
